<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MSE TOOL VISION</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mse-red: #D32F2F; 
            --bg: linear-gradient(135deg, #2c2c2e 0%, #48484a 50%, #1c1c1e 100%);
            --card: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF; --text-dim: #A1A1A6; --border: rgba(255, 255, 255, 0.15);
            --safe-top: env(safe-area-inset-top);
        }

        [data-theme="light"] {
            --bg: linear-gradient(135deg, #e5e5ea 0%, #ffffff 100%);
            --card: rgba(0, 0, 0, 0.05);
            --text: #000000; --text-dim: #636366; --border: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); background-attachment: fixed;
            color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; 
            overflow: hidden; position: relative; 
        }

        body::after {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background-image: url('https://www.transparenttextures.com/patterns/brushed-alum.png');
            opacity: 0.12; pointer-events: none;
        }

        header { padding: calc(var(--safe-top) + 25px) 24px 15px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 26px; font-weight: 900; letter-spacing: -1.5px; }
        .brand span { color: var(--mse-red); }

        .theme-btn { 
            width: 48px; height: 48px; border-radius: 16px; 
            background: var(--card); border: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(20px); cursor: pointer;
        }

        /* ANIMATIONS ONE UI 8 */
        .window { 
            position: fixed; inset: 0; background: var(--bg); z-index: 1000; 
            display: none; flex-direction: column; transform-origin: center;
        }

        @keyframes oneUI-In {
            from { opacity: 0; transform: scale(0.92); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes oneUI-Out {
            from { opacity: 1; transform: scale(1); filter: blur(0); }
            to { opacity: 0; transform: scale(1.05); filter: blur(15px); }
        }

        .win-animate-in { animation: oneUI-In 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .win-animate-out { animation: oneUI-Out 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        #hub { height: 100%; overflow-y: auto; padding: 0 20px 240px; }
        .section-header { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin: 35px 0 15px 5px; letter-spacing: 1.5px; }
        
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .icon { 
            width: 100%; aspect-ratio: 1/1; border-radius: 26px; 
            background: var(--card); border: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(15px); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }
        .app:active .icon { transform: scale(0.92); }
        .icon img { width: 100%; height: 100%; object-fit: cover; }
        .app span { font-size: 10px; font-weight: 700; text-align: center; color: var(--text); white-space: nowrap; }

        .card { background: var(--card); border-radius: 28px; padding: 22px; margin-bottom: 15px; border: 1px solid var(--border); backdrop-filter: blur(30px); }
        .card h4 { margin: 0 0 15px; font-size: 10px; color: var(--mse-red); text-transform: uppercase; font-weight: 900; }
        
        input, textarea, select { 
            width: 100%; background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border); border-radius: 18px; 
            padding: 16px; color: var(--text); font-size: 16px; margin-bottom: 12px;
        }

        .dock { position: fixed; bottom: 35px; left: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 35px; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(40px); z-index: 1100; }
        .btn { background: var(--mse-red); color: #fff; border: none; padding: 16px 35px; border-radius: 22px; font-weight: 800; cursor: pointer; }
        
        #pdf-paper { width: 210mm; background: white !important; display: none; }
        
        /* Archive Grid Custom */
        .archive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .visual-preview { width: 100%; aspect-ratio: 1/1.4; background: white; border-radius: 12px; margin-bottom: 8px; position: relative; padding: 10px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
        .v-line { width: 100%; height: 2px; background: #eee; }
        .v-box { width: 40%; height: 12px; background: var(--mse-red); opacity: 0.1; }
    </style>
</head>
<body>

<header>
    <div class="brand">MSE <span>TOOL</span></div>
    <div class="theme-btn" onclick="Core.toggleTheme()">🌓</div>
</header>

<div id="hub">
    <div class="section-header">Elite Invoicing</div>
    <div class="grid-3x3">
        <div class="app" onclick="Core.open('FACTURE', 'premium')"><div class="icon"><img src="facture.png"></div><span>Facture TVA</span></div>
        <div class="app" onclick="Core.open('DEVIS', 'premium')"><div class="icon"><img src="devis.png"></div><span>Devis TVA</span></div>
        <div class="app" onclick="Core.open('ACQUITTEE')"><div class="icon"><img src="acquittee.png"></div><span>Acquittée</span></div>
    </div>
    
    <div class="section-header">Micro Management</div>
    <div class="grid-3x3">
        <div class="app" onclick="Core.open('FACTURE', 'micro')"><div class="icon"><img src="facture.png"></div><span>Facture TTC</span></div>
        <div class="app" onclick="Core.open('DEVIS', 'micro')"><div class="icon"><img src="devis.png"></div><span>Devis TTC</span></div>
        <div class="app"></div> 
    </div>

    <div class="section-header">Cloud & Archives</div>
    <div class="grid-3x3">
        <div class="app" onclick="Core.open('CLIENTS')"><div class="icon"><img src="clients.png"></div><span>Clients</span></div>
        <div class="app" onclick="Core.open('ARCHIVES')"><div class="icon"><img src="archives.png"></div><span>Archives</span></div>
        <div class="app" onclick="Core.open('SETTINGS')"><div class="icon" style="background:rgba(255,255,255,0.1)"><svg style="width:40%;fill:white" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.84,9.48l2.03,1.58C4.82,11.36,4.8,11.68,4.8,12c0,0.33,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z"/></svg></div><span>Cloud</span></div>
    </div>
</div>

<div id="win" class="window">
    <div class="win-header">
        <button class="theme-btn" style="border:none; background:none; font-size:24px;" onclick="Core.back()">✕</button>
        <b id="win-title"></b>
    </div>
    <div class="win-body" id="win-content"></div>
    <div class="dock" id="win-dock" style="display:none;">
        <div id="dock-total" style="font-size:22px; font-weight:900;">0.00 €</div>
        <button class="btn" onclick="Core.generatePDF()">VALIDER & CLOUD</button>
    </div>
</div>

<div id="pdf-paper"></div>

<script>
const USER = { 
    name: "Sabri BENNACEUR EI", 
    siren: "943032755", 
    addr: "2 Résidence des Rosiers, 92800 Puteaux, FR",
    iban: "FR76 1695 8000 0159 6810 0824 765",
    bic: "ONTO FR P1 XXX",
    dec: "RC décennale TETRIS SV75018041T37384"
};
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbzsNMAFSAolUijM6rh-G9RhzbpG4kSWjd7n_RMuQ6tY2I248YAugRQLVmvEfqNhx2ry/exec";

const Core = {
    state: {
        colors: JSON.parse(localStorage.getItem('mse_colors')) || { red: "#D32F2F", bg: "linear-gradient(135deg, #2c2c2e 0%, #48484a 50%, #1c1c1e 100%)" },
        db: { clients: JSON.parse(localStorage.getItem('mse_clients') || '[]'), history: JSON.parse(localStorage.getItem('mse_history') || '[]') },
        curType: null, curMode: null
    },

    init() { 
        this.applyStyle(); 
        window.onpopstate = () => this.back(true); 
    },

    applyStyle() { 
        const r = document.documentElement;
        r.style.setProperty('--mse-red', this.state.colors.red); 
        document.body.style.background = this.state.colors.bg;
    },
    
    open(type, mode='premium') {
        this.state.curType = type; this.state.curMode = mode;
        const win = document.getElementById('win');
        win.style.display = 'flex';
        win.classList.remove('win-animate-out');
        win.classList.add('win-animate-in');
        
        document.getElementById('win-title').innerText = type + " " + mode.toUpperCase();
        document.getElementById('win-dock').style.display = (['DEVIS','FACTURE'].includes(type)) ? 'flex' : 'none';
        
        const c = document.getElementById('win-content');
        if(['DEVIS','FACTURE'].includes(type)) this.renderEditor(c);
        else if(type === 'CLIENTS') this.renderClients(c);
        else if(type === 'ARCHIVES') this.renderHistory(c);
        else if(type === 'SETTINGS') this.renderSettings(c);
        
        history.pushState({view: 'win'}, '');
    },

    back(isPop = false) {
        const win = document.getElementById('win');
        win.classList.remove('win-animate-in');
        win.classList.add('win-animate-out');
        setTimeout(() => { 
            win.style.display = 'none'; 
            if(!isPop && history.state?.view === 'win') history.back();
        }, 300);
    },

    renderEditor(c) {
        c.innerHTML = `
            <div class="card"><h4>Dossier Client</h4>
                <input id="cn" placeholder="Nom du Client">
                <textarea id="ca" placeholder="Adresse complète" rows="2"></textarea>
                <input id="dn" placeholder="Numéro Document">
                <input id="do" placeholder="Objet de l'intervention">
            </div>
            <div class="card"><h4>Prestations</h4><div id="lines"></div>
                <button onclick="Core.addLine()" style="width:100%; padding:15px; background:none; border:1px dashed var(--border); color:var(--mse-red); border-radius:15px; font-weight:bold;">+ AJOUTER LIGNE</button>
            </div>`;
        this.addLine();
        this.calc();
    },

    addLine() {
        const d = document.createElement('div');
        d.innerHTML = `<div class="line-item" style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:10px;">
            <input class="lt" placeholder="Désignation">
            <input type="number" class="lq" value="1" oninput="Core.calc()">
            <input type="number" class="lp" placeholder="Prix HT" oninput="Core.calc()">
        </div>`;
        document.getElementById('lines').appendChild(d);
    },

    calc() {
        let ht = 0;
        document.querySelectorAll('.line-item').forEach(item => {
            ht += (item.querySelector('.lq').value * item.querySelector('.lp').value);
        });
        const total = this.state.curMode === 'premium' ? ht * 1.2 : ht;
        document.getElementById('dock-total').innerText = total.toFixed(2) + " €";
        return {ht, total};
    },

    async generatePDF() {
        const d = this.calc();
        const n = document.getElementById('dn').value || "SN";
        const arch = {
            num: n, client: document.getElementById('cn').value, addr: document.getElementById('ca').value,
            obj: document.getElementById('do').value, final: d.total, val: d.ht,
            type: this.state.curType, mode: this.state.curMode, date: new Date().toLocaleDateString('fr-FR'),
            lines: Array.from(document.querySelectorAll('.line-item')).map(v => ({ lt: v.querySelector('.lt').value, lq: v.querySelector('.lq').value, lp: v.querySelector('.lp').value }))
        };
        
        this.state.db.history.push(arch);
        this.sync();
        this.pushToCloud();
        
        this.renderPDF(arch);
        const p = document.getElementById('pdf-paper');
        p.style.display = 'block';
        html2pdf().from(p).set({margin:0, filename: n+'.pdf', jsPDF:{format:'a4'}}).save().then(() => {
            p.style.display = 'none';
            this.back();
        });
    },

    renderPDF(h) {
        const isP = (h.mode === 'premium');
        document.getElementById('pdf-paper').innerHTML = `
        <div style="padding:50px; background:white; color:#333; font-family:'Inter', sans-serif;">
            <div style="display:flex; justify-content:space-between; border-bottom:3px solid #eee; padding-bottom:40px;">
                <img src="logo.png" style="max-width:200px;">
                <div style="text-align:right; font-size:12px;"><strong>${USER.name}</strong><br>${USER.addr}<br>SIRET: ${USER.siren}</div>
            </div>
            <div style="padding:40px 0;">
                <div style="display:flex; justify-content:space-between;">
                    <div><h1 style="margin:0; font-size:28px; color:var(--mse-red);">${h.type} N° ${h.num}</h1><b>Objet : ${h.obj}</b></div>
                    <div style="text-align:right; background:#f9f9f9; padding:15px; border-radius:10px; min-width:200px;">
                        <small>DESTINATAIRE</small><br><strong>${h.client}</strong><br>${h.addr}
                    </div>
                </div>
                <table style="width:100%; border-collapse:collapse; margin-top:30px;">
                    <tr style="background:#333; color:#fff;"><th style="padding:10px; text-align:left;">Désignation</th><th style="text-align:right; padding:10px;">Total</th></tr>
                    ${h.lines.map(l => `<tr><td style="padding:10px; border-bottom:1px solid #eee;">${l.lt} (x${l.lq})</td><td style="text-align:right; padding:10px; border-bottom:1px solid #eee;">${(l.lq*l.lp).toFixed(2)} €</td></tr>`).join('')}
                </table>
                <div style="text-align:right; margin-top:30px;">
                    <h2 style="color:var(--mse-red);">TOTAL TTC : ${h.final.toFixed(2)} €</h2>
                    <small>${isP ? 'TVA 20% incluse' : 'TVA non applicable'}</small>
                </div>
            </div>
        </div>`;
    },

    renderHistory(c) {
        c.innerHTML = `<div class="archive-grid">` + [...this.state.db.history].reverse().map(h => `
            <div class="card" style="padding:12px;">
                <div class="visual-preview"><div class="v-box"></div><div class="v-line"></div><div class="v-line"></div></div>
                <b style="font-size:12px;">${h.num}</b><br><small>${h.client}</small><br>
                <b style="color:var(--mse-red);">${h.final.toFixed(2)}€</b>
            </div>`).join('') + `</div>`;
    },

    renderSettings(c) {
        c.innerHTML = `
            <div class="card"><h4>Personnalisation</h4>
                <label>Couleur d'accent</label><input type="color" value="${this.state.colors.red}" onchange="Core.updateColor('red', this.value)">
                <label>Fond d'écran</label>
                <select onchange="Core.updateColor('bg', this.value)">
                    <option value="linear-gradient(135deg, #2c2c2e 0%, #48484a 50%, #1c1c1e 100%)">Gris Métal</option>
                    <option value="#000000">Noir AMOLED</option>
                    <option value="#2c2c2e">Gris Anthracite</option>
                </select>
            </div>
            <div class="card"><h4>Cloud</h4>
                <button class="btn" style="width:100%; background:#34A853;" onclick="Core.pushToCloud()">☁️ SYNCHRONISER DRIVE</button>
                <button class="btn" style="width:100%; background:#4285F4; margin-top:10px;" onclick="Core.pullFromCloud()">🔄 RESTAURER DONNÉES</button>
            </div>`;
    },

    updateColor(k, v) { this.state.colors[k] = v; localStorage.setItem('mse_colors', JSON.stringify(this.state.colors)); this.applyStyle(); },
    
    async pushToCloud() {
        const data = { history: this.state.db.history, clients: this.state.db.clients, colors: this.state.colors };
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
    },

    async pullFromCloud() {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();
        if(data) {
            this.state.db.history = data.history || [];
            this.state.db.clients = data.clients || [];
            this.sync(); location.reload();
        }
    },

    sync() { 
        localStorage.setItem('mse_history', JSON.stringify(this.state.db.history));
        localStorage.setItem('mse_clients', JSON.stringify(this.state.db.clients));
    },

    toggleTheme() {
        const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
    }
};

Core.init();
</script>
</body>
</html>
