<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MSE TOOL VISION</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mse-red: #D32F2F; 
            /* Fond Gris Métallisé par défaut */
            --bg: linear-gradient(135deg, #2c2c2e 0%, #48484a 50%, #1c1c1e 100%);
            --card: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF; --text-dim: #A1A1A6; --border: rgba(255, 255, 255, 0.15);
            --safe-top: env(safe-area-inset-top);
        }

        [data-theme="light"] {
            --bg: linear-gradient(135deg, #e5e5ea 0%, #ffffff 100%);
            --card: rgba(0, 0, 0, 0.05);
            --text: #000000; --text-dim: #636366; --border: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            background-attachment: fixed;
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            position: relative; 
        }

        /* Effet de grain métallique */
        body::after {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background-image: url('https://www.transparenttextures.com/patterns/brushed-alum.png');
            opacity: 0.15; pointer-events: none;
        }

        header { padding: calc(var(--safe-top) + 25px) 24px 15px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 26px; font-weight: 900; letter-spacing: -1.5px; }
        .brand span { color: var(--mse-red); }

        .theme-btn { 
            width: 48px; height: 48px; border-radius: 16px; 
            background: var(--card); border: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(20px); transition: 0.3s;
        }

        /* ANIMATIONS ONE UI 8 */
        .window { 
            position: fixed; inset: 0; background: var(--bg); z-index: 1000; 
            display: none; flex-direction: column;
            transform-origin: center;
        }

        /* Entrée One UI : Zoom progressif + Fade + Flou */
        @keyframes oneUI-In {
            from { opacity: 0; transform: scale(0.85); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        /* Sortie One UI : Zoom arrière + Fade + Flou */
        @keyframes oneUI-Out {
            from { opacity: 1; transform: scale(1); filter: blur(0); }
            to { opacity: 0; transform: scale(1.1); filter: blur(15px); }
        }

        .win-animate-in { animation: oneUI-In 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .win-animate-out { animation: oneUI-Out 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        #hub { height: 100%; overflow-y: auto; padding: 0 20px 240px; }
        .section-header { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin: 35px 0 15px 5px; letter-spacing: 1.5px; }
        
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .icon { 
            width: 100%; aspect-ratio: 1/1; border-radius: 24px; 
            background: var(--card); border: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(15px); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .app:active .icon { transform: scale(0.9); }
        .icon img { width: 55%; height: 55%; object-fit: contain; }
        .app span { font-size: 11px; font-weight: 600; text-align: center; color: var(--text); }

        .card { background: var(--card); border-radius: 28px; padding: 22px; margin-bottom: 15px; border: 1px solid var(--border); backdrop-filter: blur(30px); }
        input, textarea, select { 
            width: 100%; background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border); border-radius: 16px; 
            padding: 15px; color: var(--text); font-size: 16px; margin-bottom: 10px;
        }

        .dock { position: fixed; bottom: 35px; left: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 35px; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(40px); }
        .btn { background: var(--mse-red); color: #fff; border: none; padding: 15px 35px; border-radius: 20px; font-weight: 800; cursor: pointer; }
        
        #pdf-paper { width: 210mm; background: white !important; display: none; }
    </style>
</head>
<body>

<header>
    <div class="brand">MSE <span>TOOL</span></div>
    <div class="theme-btn" onclick="Core.toggleTheme()">🌓</div>
</header>

<div id="hub">
    <div class="section-header">Facturation</div>
    <div class="grid-3x3">
        <div class="app" onclick="Core.open('FACTURE', 'premium')"><div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/1052/1052856.png"></div><span>Facture TVA</span></div>
        <div class="app" onclick="Core.open('DEVIS', 'premium')"><div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/1052/1052856.png"></div><span>Devis TVA</span></div>
        <div class="app" onclick="Core.open('ACQUITTEE')"><div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/190/190411.png"></div><span>Acquittée</span></div>
    </div>
    
    <div class="section-header">Gestion & Cloud</div>
    <div class="grid-3x3">
        <div class="app" onclick="Core.open('ARCHIVES')"><div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/2892/2892135.png"></div><span>Archives</span></div>
        <div class="app" onclick="Core.open('CLIENTS')"><div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/6009/6009864.png"></div><span>Clients</span></div>
        <div class="app" onclick="Core.open('SETTINGS')"><div class="icon"><img src="https://cdn-icons-png.flaticon.com/512/724/724933.png"></div><span>Réglages</span></div>
    </div>
</div>

<div id="win" class="window">
    <div class="win-header">
        <button class="theme-btn" style="border:none; background:none;" onclick="Core.back()">✕</button>
        <b id="win-title" style="font-size: 18px;"></b>
    </div>
    <div class="win-body" id="win-content"></div>
    <div class="dock" id="win-dock" style="display:none;">
        <div id="dock-total" style="font-size:22px; font-weight:900;">0.00 €</div>
        <button class="btn" onclick="Core.generatePDF()">VALIDER & CLOUD</button>
    </div>
</div>

<div id="pdf-paper"></div>

<script>
const USER = { 
    name: "Sabri BENNACEUR EI", 
    siren: "943032755", 
    addr: "2 Résidence des Rosiers, 92800 Puteaux, FR",
    iban: "FR76 1695 8000 0159 6810 0824 765",
    bic: "ONTO FR P1 XXX"
};
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbzsNMAFSAolUijM6rh-G9RhzbpG4kSWjd7n_RMuQ6tY2I248YAugRQLVmvEfqNhx2ry/exec";

const Core = {
    state: {
        colors: JSON.parse(localStorage.getItem('mse_colors')) || { red: "#D32F2F", bg: "linear-gradient(135deg, #2c2c2e 0%, #48484a 50%, #1c1c1e 100%)" },
        db: { clients: JSON.parse(localStorage.getItem('mse_clients') || '[]'), history: JSON.parse(localStorage.getItem('mse_history') || '[]') }
    },

    init() { 
        this.applyStyle(); 
        window.onpopstate = () => this.back(true); 
    },

    applyStyle() { 
        const r = document.documentElement;
        r.style.setProperty('--mse-red', this.state.colors.red); 
        document.body.style.background = this.state.colors.bg;
    },
    
    open(type, mode='premium') {
        this.state.curType = type; this.state.curMode = mode;
        const win = document.getElementById('win');
        win.style.display = 'flex';
        win.classList.remove('win-animate-out');
        win.classList.add('win-animate-in');
        
        document.getElementById('win-title').innerText = type;
        document.getElementById('win-dock').style.display = (['DEVIS','FACTURE'].includes(type)) ? 'flex' : 'none';
        
        const c = document.getElementById('win-content');
        if(['DEVIS','FACTURE'].includes(type)) this.renderEditor(c);
        else if(type === 'ARCHIVES') this.renderHistory(c);
        else if(type === 'SETTINGS') this.renderSettings(c);
        
        history.pushState({view: 'win'}, '');
    },

    back(isPop = false) {
        const win = document.getElementById('win');
        win.classList.remove('win-animate-in');
        win.classList.add('win-animate-out');
        setTimeout(() => { 
            win.style.display = 'none'; 
            if(!isPop) history.back();
        }, 400);
    },

    renderEditor(c) {
        c.innerHTML = `
            <div class="card"><h4>Infos Client</h4>
                <input id="cn" placeholder="Nom du Client">
                <textarea id="ca" placeholder="Adresse"></textarea>
                <input id="dn" placeholder="N° Document">
                <input id="do" placeholder="Objet">
            </div>
            <div class="card"><h4>Lignes</h4><div id="lines"></div>
                <button onclick="Core.addLine()" style="width:100%; padding:15px; background:none; border:1px dashed var(--border); color:var(--text); border-radius:15px;">+ Ajouter prestation</button>
            </div>`;
        this.addLine();
        this.calc();
    },

    addLine() {
        const d = document.createElement('div');
        d.innerHTML = `<div class="line-item" style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:10px;">
            <input class="lt" placeholder="Titre">
            <input type="number" class="lq" value="1" oninput="Core.calc()">
            <input type="number" class="lp" placeholder="Prix" oninput="Core.calc()">
        </div>`;
        document.getElementById('lines').appendChild(d);
    },

    calc() {
        let total = 0;
        document.querySelectorAll('.line-item').forEach(item => {
            total += (item.querySelector('.lq').value * item.querySelector('.lp').value);
        });
        document.getElementById('dock-total').innerText = total.toFixed(2) + " €";
        return total;
    },

    async generatePDF() {
        const total = this.calc();
        const n = document.getElementById('dn').value || "SN";
        const entry = {
            num: n, client: document.getElementById('cn').value, addr: document.getElementById('ca').value,
            final: total, type: this.state.curType, date: new Date().toLocaleDateString('fr-FR')
        };
        
        this.state.db.history.push(entry);
        this.sync();
        this.pushToCloud();
        
        alert("Enregistré dans l'archive et sur le Cloud !");
        this.back();
    },

    renderHistory(c) {
        c.innerHTML = `<div class="archive-grid">` + this.state.db.history.reverse().map(h => `
            <div class="card" style="margin-bottom:0;">
                <b style="color:var(--mse-red);">${h.type}</b><br>
                <small>${h.num}</small><br>
                <b>${h.final.toFixed(2)}€</b><br>
                <span style="font-size:10px; opacity:0.6;">${h.client}</span>
            </div>`).join('') + `</div>`;
    },

    renderSettings(c) {
        c.innerHTML = `
            <div class="card"><h4>Couleur Thème</h4>
                <input type="color" value="${this.state.colors.red}" onchange="Core.updateColor('red', this.value)">
            </div>
            <div class="card"><h4>Fond d'écran</h4>
                <select onchange="Core.updateColor('bg', this.value)">
                    <option value="linear-gradient(135deg, #2c2c2e 0%, #48484a 50%, #1c1c1e 100%)">Gris Métal (Défaut)</option>
                    <option value="linear-gradient(135deg, #1a1a1a 0%, #000000 100%)">Noir Profond</option>
                    <option value="linear-gradient(135deg, #D32F2F 0%, #8B0000 100%)">Rouge MSE</option>
                    <option value="#2c2c2e">Gris Plat</option>
                </select>
            </div>
            <button class="btn" style="width:100%; background:#4285F4;" onclick="Core.pullFromCloud()">🔄 RESTAURER DEPUIS CLOUD</button>`;
    },

    updateColor(k, v) {
        this.state.colors[k] = v;
        localStorage.setItem('mse_colors', JSON.stringify(this.state.colors));
        this.applyStyle();
    },

    async pushToCloud() {
        const data = { history: this.state.db.history, clients: this.state.db.clients, colors: this.state.colors };
        fetch(CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
    },

    async pullFromCloud() {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();
        if(data) {
            this.state.db.history = data.history || [];
            this.state.colors = data.colors || this.state.colors;
            this.sync();
            location.reload();
        }
    },

    sync() {
        localStorage.setItem('mse_history', JSON.stringify(this.state.db.history));
    },

    toggleTheme() {
        const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
    }
};

Core.init();
</script>
</body>
</html>
